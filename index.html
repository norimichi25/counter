<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カウンター</title>
<style>
body {
  text-align: center;
  font-family: sans-serif;
}
#count {
  font-size: 60px;
  margin: 20px;
}
button {
  font-size: 20px;
  margin: 10px;
  padding: 10px 20px;
}
</style>
</head>
<body>

<h1>カウンター</h1>
<div id="count">0</div>

<button onclick="add()">＋1</button>
<button onclick="sub()">−1</button>
<button onclick="reset()">リセット</button>
<br>
<button onclick="dice()">🎲 サイコロ</button>

<div id="diceResult"></div>

<script>
let count = 0;

function update() {
  document.getElementById("count").innerText = count;
}

function add() {
  count++;
  update();
}

function sub() {
  count--;
  update();
}

function reset() {
  count = 0;
  update();
}

function dice() {
  const result = Math.floor(Math.random() * 6) + 1;
  document.getElementById("diceResult").innerText = "🎲 " + result;
}
</script>

</body>
</html>
