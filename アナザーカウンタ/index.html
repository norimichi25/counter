<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボードゲームカウンター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- 左プレイヤー -->
    <div class="player" id="player1"></div>

    <!-- 中央（サイコロ & リセット） -->
    <div class="center">
        <button class="reset" onclick="confirmReset()">リセット</button>

        <div class="dice-area">
            <div id="diceResult">🎲</div>
            <button onclick="rollDice()">サイコロ</button>
        </div>
    </div>

    <!-- 右プレイヤー -->
    <div class="player" id="player2"></div>

</div>

<script src="script.js"></script>
</body>
</html>
